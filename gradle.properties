org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---- Release configuration (developer-owned; see README "Release configuration") ----
# Leave empty until you own real values. Empty values hide the related Settings rows
# instead of pointing at invented destinations. Prefer setting these in
# ~/.gradle/gradle.properties or with -P flags rather than committing them.
swipegallery.supportEmail=
swipegallery.privacyUrl=
swipegallery.termsUrl=
# Premium is an auto-renewing subscription with two base plans. Prices are set in Play Console
# (intended: monthly 2.99 USD, yearly 12.99 USD); the app always shows Play's localized price.
swipegallery.premiumProductId=swipe_gallery_premium
swipegallery.monthlyBasePlanId=monthly
swipegallery.yearlyBasePlanId=yearly
